<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBF7FF"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- mount point -->
  <circle cx="512" cy="220" r="10" fill="#0097A7" opacity="0.8"/>

  <!-- rods -->
  <g stroke="#00BCD4" stroke-width="14" stroke-linecap="round">
    <!-- first rod -->
    <line x1="512" y1="220" x2="512" y2="520"/>
    <!-- second rod (angled) -->
    <line x1="512" y1="520" x2="740" y2="760"/>
  </g>

  <!-- trail arc suggesting motion -->
  <path d="M720 740 Q 760 690 820 720" fill="none" stroke="#00ACC1" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

  <!-- bobs with subtle shadow -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="520" r="34" fill="#00BCD4"/>
    <circle cx="740" cy="760" r="42" fill="#0097A7"/>
  </g>

  <!-- subtle frame -->
  <rect x="36" y="36" width="952" height="952" rx="120" ry="120" fill="none" stroke="#B2EBF2" stroke-width="8"/>
</svg>

